name: Rilis APK Bakafrawi Studio

on:
  workflow_dispatch:
    inputs:
      versi:
        description: "Tag rilis (mis. v2.1.1)"
        required: true
      catatan:
        description: "Catatan pembaruan singkat"
        required: false
        default: "Pembaruan Bakafrawi Studio Android."

permissions:
  contents: write

jobs:
  rilis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan keystore rilis dari GitHub Secrets
        working-directory: aplikasi-android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > bakafrawi-studio.jks
            cat <<EOF > keystore.properties
          storeFile=bakafrawi-studio.jks
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          else
            echo "Keystore secret belum diisi; melanjutkan tanpa signing rilis."
          fi

      - name: Bangun APK Release
        working-directory: aplikasi-android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Terbitkan ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.versi }}
          CATATAN: ${{ inputs.catatan }}
        run: |
          APK="aplikasi-android/app/build/outputs/apk/release/app-release.apk"
          NAMA="bakafrawi-studio-${TAG}.apk"
          cp "$APK" "$NAMA"
          gh release create "$TAG" "$NAMA" \
            --title "Bakafrawi Studio ${TAG}" \
            --notes "$CATATAN" \
            --latest
