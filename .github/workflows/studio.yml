# Mesin Studio AI bakafrawi.com di server GitHub — PC tidak perlu menyala.
# Dinyalakan /api/studio/jalankan begitu admin membuat tugas dan oleh Supabase (pg_cron
# studio_picu, tiap 5 menit bila ada kerja); jadwal 30 menit di sini hanya cadangan.
# Satu putaran mengerjakan tugas antre lalu selesai; tanpa kerja, berhenti sebelum memasang apa pun.
name: Studio AI

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

# Satu putaran pada satu waktu; database juga mengunci tiap tugas (studio_ambil_tugas).
concurrency:
  group: studio-ai
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STUDIO_TANPA_CLAUDE: ${{ secrets.STUDIO_TANPA_CLAUDE }}
      STUDIO_AI_PROVIDER: ${{ secrets.STUDIO_AI_PROVIDER }}
      # Suara narasi AI (ElevenLabs prioritas 1 bila diisi → fallback Gemini TTS → Edge TTS).
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Bank media merek (Lek Kopi) di Google Drive lewat rclone, remote "gdrive" dari variabel lingkungan.
      # Token dibuat sekali di PC Kyai (rclone config); client_id/secret WAJIB sama dengan pembuat token.
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      # Draf TikTok per merek: memperpanjang token butuh kunci aplikasi TikTok (sama dengan di Vercel).
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      # Kata sandi akun demo untuk skenario rekaman: {{RAHASIA:NAMA}} → env DEMO_NAMA.
      # Daftarkan satu per satu di sini (contoh: DEMO_WASEELA_SANDI dari rahasia bernama sama),
      # jangan mengirim seluruh rahasia sekaligus — GitHub menahan workflow dengan pola itu.
    steps:
      - name: Cek ada kerja
        id: cek
        run: |
          # Versi image runner (variabel mesin, tak terbaca lewat konteks env) → kunci cache ffmpeg.
          echo "image=${ImageOS:-ubuntu}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Rahasia Supabase belum dipasang — putaran dilewati."; echo "kerja=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Fungsi belum ada (migrasi belum dipasang) / galat → anggap ada kerja, jangan melewatkan tugas.
          jawab=$(curl -sS --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/studio_ada_kerja"             -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"             -H "Content-Type: application/json" -d '{}' || echo true)
          echo "studio_ada_kerja → $jawab"
          if [ "$jawab" = "false" ]; then echo "kerja=false" >> "$GITHUB_OUTPUT"; else echo "kerja=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.cek.outputs.kerja == 'true'
        with:
          sparse-checkout: |
            studio
            public/logo.png
            public/lekkopi-opening-story.mp4
            public/lekkopi-opening-story.jpg
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: steps.cek.outputs.kerja == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            studio/package-lock.json
            studio/remotion/package-lock.json

      # Cermin apt Ubuntu kadang lambat (18 Nov: 8,5 menit). Paket .deb disimpan di cache per versi
      # image runner, jadi umumnya dipasang dari cache dalam hitungan detik.
      - name: Cache paket ffmpeg
        if: steps.cek.outputs.kerja == 'true'
        uses: actions/cache@v4
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-rclone-${{ steps.cek.outputs.image }}

      - name: Pasang ffmpeg & huruf
        if: steps.cek.outputs.kerja == 'true'
        run: |
          pasang_baru() {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends --download-only ffmpeg fonts-dejavu-core rclone > /dev/null
            mkdir -p ~/apt-ffmpeg && cp /var/cache/apt/archives/*.deb ~/apt-ffmpeg/
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core rclone > /dev/null
          }
          if ls ~/apt-ffmpeg/*.deb > /dev/null 2>&1; then
            sudo dpkg -i ~/apt-ffmpeg/*.deb > /dev/null 2>&1 || { echo "Cache ffmpeg tak cocok — pasang ulang"; rm -rf ~/apt-ffmpeg; pasang_baru; }
          else
            pasang_baru
          fi
          ffmpeg -version | head -1
          rclone version | head -1
          # Token rclone harus JSON asli ({"access_token":…}), bukan salinan ber-escape dari layar ({\"access_token\":…}).
          if [ -n "$RCLONE_CONFIG_GDRIVE_TOKEN" ] && ! printf '%s' "$RCLONE_CONFIG_GDRIVE_TOKEN" | jq -e '.refresh_token' > /dev/null 2>&1; then
            echo "::warning::Rahasia RCLONE_DRIVE_TOKEN bukan JSON token rclone yang sah — set ulang (PANDUAN-STUDIO.md)."
          fi
          # Video iPhone (HLG) di bank media butuh zscale untuk dipetakan ke SDR (bank/rakit.mjs KE_SDR).
          ffmpeg -hide_banner -filters | grep -q zscale || echo "⚠️ ffmpeg tanpa zscale — klip HDR akan gagal"
          google-chrome --version

      # Model penghapus latar karakter maskot (MODNet, ±25 MB dari Hugging Face) disimpan antar-putaran.
      - name: Cache model hapus latar
        if: steps.cek.outputs.kerja == 'true'
        uses: actions/cache@v4
        with:
          path: studio/.model
          key: model-latar-modnet-v1

      - name: Pasang paket Node
        if: steps.cek.outputs.kerja == 'true'
        working-directory: studio
        # Video iklan produk dirender Remotion (studio/remotion) dengan Chrome Headless Shell miliknya
        # sendiri; Chrome sistem tetap dipakai Playwright untuk tangkapan layar & poster.
        run: |
          npm ci
          npm ci --prefix remotion
          (cd remotion && npx remotion browser ensure)

      - name: Jalankan satu putaran Studio
        if: steps.cek.outputs.kerja == 'true'
        working-directory: studio
        run: node studio.mjs
